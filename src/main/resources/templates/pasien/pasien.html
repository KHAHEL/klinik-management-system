<head>
    <title>Pasien Management</title>
    <link rel="stylesheet" type="text/css" th:href="@{/css/home.css}" />
    <link rel="stylesheet" type="text/css" th:href="@{/css/table.css}" />

</head>
<body>

<div class="first-box">

    <h2>Daftar Poli</h2>

    <form th:action="@{/pasien/daftar-poli}" method="post" class="admin-form">

        <input type="hidden" name="id_pasien" th:value="${logPasien.idPengguna}" />


        <div class="form-row">
            <label>Pilih Poli</label>
            <select name="poli" required>
                <option disabled selected value="">-- pilih poli --</option>
                <option value="Umum">Umum</option>
                <option value="Gigi">Gigi</option>
                <option value="Anak">Anak</option>
            </select>
        </div>

        <div class="form-row">
            <label>Tanggal Daftar</label>
            <input type="date" name="tglDaftar" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="dokter-card-btn">
                <i class="fa fa-plus"></i> Daftar Poli
            </button>
        </div>

    </form>

</div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
