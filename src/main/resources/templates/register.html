<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Pasien</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>

<body>

<div class="register-card">

    <div class="left-panel">
        <h1>Daftar Pasien</h1>
        <p>Lengkapi data Anda untuk membuat akun.</p>
    </div>

    <div class="right-panel">
        <h3 class="text-center mb-4">REGISTER AKUN</h3>

        <form th:action="@{/register}" method="post" th:object="${pasienInfo}">

            <div class="form-grid">

                <div>
                    <label class="form-label">Nama</label>
                    <input type="text" class="form-control" name="nama" required>
                </div>

                <div>
                    <label class="form-label">Umur</label>
                    <input type="number" class="form-control" name="umur" required>
                </div>

                <div>
                    <label class="form-label">Gender</label>
                    <select class="form-select" name="gender" required>
                        <option value="">Pilih</option>
                        <option value="L">Laki-laki</option>
                        <option value="P">Perempuan</option>
                    </select>
                </div>

                <div>
                    <label class="form-label">No Telepon</label>
                    <input type="text" class="form-control" name="noTelp" required>
                </div>

                <div class="full">
                    <label class="form-label">Alamat</label>
                    <textarea class="form-control" name="alamat" required></textarea>
                </div>

                <div class="full">
                    <label class="form-label">Keluhan</label>
                    <textarea class="form-control" name="keluhan" required></textarea>
                </div>

                <div class="full">
                    <label class="form-label">Riwayat Medis</label>
                    <textarea class="form-control" name="riwayatMedis"></textarea>
                </div>

                <div>
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" name="username" required>
                </div>

                <div>
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" required>
                </div>

            </div>

            <button class="btn-green mt-3">Register</button>

            <a th:href="@{/login}" class="back-login">← Back to Login</a>

        </form>
    </div>

</div>

</body>
</html>
